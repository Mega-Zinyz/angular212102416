<div class="wrapper">
    <app-header></app-header>
    <app-sidebar moduleName="forex"></app-sidebar>

    <div class="content-wrapper">
    <!-- Content Header (Page header) -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0 text-dark">Forex</h1>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
                        <li class="breadcrumb-item active">Forex</li>
                        </ol>
                    </div>
                </div>
            </div>
        </div>

        <section class="content">
            <div class="container-fluid">
                <!-- Main row -->
                <div class="row">
                    <div class="table-responsive">
                        <table id="table1" class="table table-hover table-bordered table-striped">
                            <thead>
                                <tr>
                                    <th>No</th>
                                    <th>Simbol</th>
                                    <th>Nama Mata Uang</th>
                                    <th>Kurs</th>
                                </tr>
                            </thead>
                            <tbody>
                                @for (c of currencies; track c.code; let i = $index) {
                                    <tr>
                                        <td>{{ i + 1 }}</td>
                                        <td>
                                            @if (c.countryCode) {
                                                <span class="fi fi-{{ c.countryCode }}" style="margin-right: 8px;"></span>
                                            }
                                            {{ c.symbol }} <small class="text-muted">({{ c.code }})</small>
                                        </td>
                                        <td>{{ c.name }}</td>
                                        <td>{{ c.rate }}</td>
                                    </tr>
                                }
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <app-footer></app-footer>
</div>
